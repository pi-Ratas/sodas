<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<script src="/sodas/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Žemė</title>
<link rel="icon" type="image/svg+xml" href="/sodas/ikonos/zenkliukas.svg">
<link rel="stylesheet" href="/sodas/theme.css">
<script src="/sodas/theme.js"></script>
<script src="/sodas/bar.js"></script>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.muted { color: var(--muted); }
.tabs { display: flex; gap: 2px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.tab { padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
main { flex: 1; min-height: 0; position: relative; }
iframe.pane { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
</style>
</head>
<body>
<header class="kalba-bar">
  <nav class="kalba-nav">
    <a href="/zeme" data-nav="zeme" class="active">Žemė</a><a href="/" id="navGarden" data-nav="sodas">Sodas</a><a href="/vaiva" id="navVaiva" data-nav="vaiva">Vaiva</a>
  </nav>
  <span class="muted">Žemė – duomenynai, iš kurių auga sodai</span>
</header>
<div class="tabs">
  <div class="tab" data-tab="duomenynai">Duomenynai</div>
  <div class="tab" data-tab="lkezdb" title="LKEŽDB žodžių aiškinimas kalbos modeliu ir įtraukimas į Neo4j">LKEŽDB</div>
</div>
<main id="main"></main>
<script src="/sodas/zeme.js"></script>
</body>
</html>
